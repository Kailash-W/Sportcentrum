<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sportcentrum De Linde – Wireframe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--b:#0a4fd6;--bd:#062f85;--bl:#e8f0ff;--t:#1d2430;--g:#8a94a6;--l:#eef1f6;--w:#fff;--ok:#12805c;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--t);font:16px/1.5 Barlow,Arial,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;margin:0 0 .4em;line-height:1.05}
h1{font-size:2.6rem}h2{font-size:1.6rem;color:var(--bd)}h3{font-size:1.2rem}
.top{background:var(--b);color:#fff;padding:14px 20px}.top h1{font-size:2rem;margin:0}.top p{margin:2px 0 0;opacity:.9}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:3px solid var(--b);background:#fff;position:sticky;top:0;z-index:5}
.tabs button{flex:none;border:2px solid var(--b);background:#fff;color:var(--b);font:600 .95rem Barlow,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--b);color:#fff}
main{max-width:1000px;margin:0 auto;padding:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{background:var(--bl);color:var(--bd);border-radius:6px;padding:3px 10px;font-weight:600;font-size:.9rem}
.note{background:#fff8e1;border-left:5px solid #f2b400;padding:10px 14px;margin:0 0 16px;font-size:.95rem}
.frame{border:2px solid var(--t);border-radius:10px;overflow:hidden;background:#fff}
.bar{background:var(--b);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.bar b{font:italic 800 1.3rem 'Barlow Condensed',sans-serif;margin-right:auto}
.bar span{font-size:.9rem;padding:2px 0}.bar span.act{border-bottom:3px solid #fff}
.body{padding:18px}
.foot{background:var(--t);color:#dfe4ee;padding:12px 18px;font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 18px}
.ph{background:repeating-linear-gradient(135deg,var(--l) 0 12px,#e2e7ef 12px 24px);border:2px dashed var(--g);color:#5b6577;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;border-radius:6px;min-height:90px}
.hero{position:relative;min-height:210px;margin-bottom:16px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
.hero .tx{position:absolute;left:20px;bottom:36px;background:#fff;padding:10px 16px;max-width:60%;border-left:8px solid var(--b)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{border:2px solid var(--l);border-radius:8px;padding:12px;background:#fff}
.card.blue{border-color:var(--b)}
.btn{display:inline-block;background:var(--b);color:#fff;font-weight:600;padding:12px 22px;border-radius:6px;border:0;font-size:1rem;text-align:center}
.btn.o{background:#fff;color:var(--b);border:2px solid var(--b)}.btn.r{background:var(--er)}.btn.s{padding:6px 12px;font-size:.9rem}
.f{margin-bottom:12px}.f label{display:block;font-weight:600;font-size:.9rem;margin-bottom:3px}
.f div{border:2px solid var(--g);border-radius:6px;padding:10px 12px;color:var(--g);background:#fff}
.f.v div{color:var(--t);background:#f7f9fc}
.narrow{max-width:400px;margin:0 auto}
.center{max-width:820px;margin:0 auto;text-align:center}
.center h1,.center h2{text-align:center}
table{width:100%;border-collapse:collapse;font-size:.95rem}th{background:var(--b);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--l)}
.tw{overflow-x:auto;text-align:left}
.alert{background:#fdecea;border-left:6px solid var(--er);color:#7f1d1d;padding:10px 14px;margin:12px 0;font-weight:600}
.okb{background:#e6f6ef;border-left:6px solid var(--ok);color:#0b5c40;padding:8px 14px;margin:8px 0}
.side{display:grid;grid-template-columns:200px 1fr;gap:16px}
@media(max-width:640px){.side{grid-template-columns:1fr}.hero .tx{max-width:85%}h1{font-size:2rem}}
.menu{background:var(--bl);border-radius:8px;padding:10px}.menu b{color:var(--bd);display:block;margin-top:8px}.menu span{display:block;padding:2px 0 2px 10px;font-size:.92rem}
</style></head><body>
<div class="top"><h1>Sportcentrum De Linde</h1><p>Wireframe website – klik op een tabblad om een pagina te bekijken</p></div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<script>
const NAV={V:['Home','Inloggen','Registreren'],L:['Dashboard','Lessen','Activiteiten','Mijn Profiel','Uitloggen'],T:['Dashboard','Mijn Lessen','Deelnemers','Profiel','Uitloggen'],B:['Dashboard','Leden','Trainers','Medewerkers','Lessen','Uitloggen']};
const ph=(t,h=90,x='')=>`<div class="ph" style="min-height:${h}px;${x}">📷 ${t}</div>`;
const bar=(r,a)=>`<div class="bar"><b>Sportcentrum De Linde</b>${NAV[r].map(n=>`<span class="${n==a?'act':''}">${n}</span>`).join('')}</div>`;
const foot=`<div class="foot"><b>Contact</b><span>Privacybeleid</span><span>Algemene voorwaarden</span><span>info@delinde.nl</span><span>012-3456789</span><span>Lindelaan 1, Breda</span></div>`;
const fr=(r,a,b)=>`<div class="frame">${bar(r,a)}<div class="body">${b}</div>${foot}</div>`;
const fld=(l,v='')=>`<div class="f"><label>${l}</label><div>${v||l}</div></div>`;
const fv=(l,v)=>`<div class="f v"><label>${l}</label><div>${v}</div></div>`;
const meta=(v,t)=>`<div class="meta"><span class="chip">Voor: ${v}</span></div><p class="note">${t}</p>`;
const les=[['Yoga','12-10-2026','19:00','Trainer A','Zaal 2'],['Spinning','12-10-2026','19:00','Trainer B','Zaal 3'],['Boksfit','13-10-2026','18:30','Trainer C','Zaal 1'],['Zwemmen','14-10-2026','20:00','Trainer A','Zwembad']];
const act=['Groepslessen','Zwemmen','Fitness','Yoga','Spinning','Boksfit'];
const P={
'1 Home':()=>meta('Iedereen','Eerste indruk: welkom, foto’s, alle activiteiten en contact.')+fr('V','Home',
`<div class="hero">${ph('Grote sfeerfoto: mensen die sporten',210,'position:absolute;inset:0;border-radius:0')}<div class="tx"><h1>Welkom bij De Linde</h1><p style="margin:0">Sport, beweeg en ontmoet. Voor elk niveau.</p></div></div>
<div style="display:flex;gap:10px;margin-bottom:20px;justify-content:center"><span class="btn">Word lid</span><span class="btn o">Bekijk lessen</span></div>
<div class="center"><h2>Onze activiteiten</h2><div class="grid g3">${act.map(x=>`<div class="card">${ph('Foto '+x,80)}<h3 style="margin-top:8px">${x}</h3><p style="margin:0">Korte uitleg over deze activiteit.</p></div>`).join('')}</div>
<h2 style="margin-top:24px">Contact</h2><p>info@delinde.nl · 012-3456789 · Lindelaan 1, Breda</p></div>`),
'2 Inloggen':()=>meta('Iedereen','Eén eenvoudig formulier. Na inloggen ga je naar het dashboard van jouw rol.')+fr('V','Inloggen',
`<div class="narrow"><h1>Inloggen</h1>${fld('E-mailadres')}${fld('Wachtwoord','••••••••')}<span class="btn" style="width:100%">Inloggen</span><p style="text-align:center"><u>Wachtwoord vergeten?</u></p><hr style="border:1px solid var(--l)"><p style="text-align:center">Nog geen account?</p><span class="btn o" style="width:100%">Registreren</span></div>`),
'3 Registreren':()=>meta('Nieuwe leden','Alle velden zijn verplicht. Na het aanmaken ben je lid.')+fr('V','Registreren',
`<div class="narrow"><h1>Account aanmaken</h1>${fld('Naam')}${fld('Adres')}${fld('Telefoonnummer')}${fld('E-mail')}${fld('Wachtwoord','••••••••')}<span class="btn" style="width:100%">Account aanmaken</span></div>`),
'4 Dashboard lid':()=>meta('Leden','Overzicht van de lessen waarvoor jij je hebt ingeschreven, in dezelfde opzet als het lesoverzicht.')+fr('L','Dashboard',
`<div class="center"><h1>Hallo, [naam]</h1><h2>Mijn lessen</h2><div class="tw"><table><tr><th>Les</th><th>Datum</th><th>Tijd</th><th>Trainer</th><th>Locatie</th><th>Actie</th></tr>
${[les[0],les[2]].map(l=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td><td><span class="btn s r">Afmelden</span></td></tr>`).join('')}</table></div>
<p style="margin-top:16px"><span class="btn">Meer lessen bekijken</span></p></div>`),
'5 Lesoverzicht':()=>meta('Leden','Let op de melding: inschrijven op hetzelfde tijdstip als een andere les kan niet.')+fr('L','Lessen',
`<h1>Lesoverzicht</h1><div class="tw"><table><tr><th>Les</th><th>Datum</th><th>Tijd</th><th>Trainer</th><th>Locatie</th><th>Actie</th></tr>
${les.map((l,i)=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td><td>${i==0||i==2?'<span class="btn s r">Afmelden</span>':'<span class="btn s">Inschrijven</span>'}</td></tr>`).join('')}</table></div>
<div class="alert">⚠ U bent al ingeschreven voor een les op dit tijdstip.</div>
<p><small>Controle: geen dubbele tijden toestaan. Hier: Yoga is al geboekt om 19:00, dus Spinning om 19:00 geeft de melding.</small></p>`),
'6 Trainer':()=>meta('Trainers','Zelfde opbouw als het beheerdashboard: menu links, werkruimte rechts, met de knoppen Details en Deelnemers.')+fr('T','Dashboard',
`<div class="side"><div class="menu">${[['Mijn lessen','Lessen bekijken'],['Lesdetails','Details van een les'],['Deelnemers','Deelnemerslijst'],['Agenda','Weekrooster']].map(g=>`<b>${g[0]}</b>${g.slice(1).map(x=>`<span>${x}</span>`).join('')}`).join('')}</div>
<div><h1>Mijn lessen</h1><div class="tw"><table><tr><th>Les</th><th>Datum</th><th>Tijd</th><th>Zaal</th><th>Inschr.</th><th>Acties</th></tr>${[['Yoga','12-10-2026','19:00','Zaal 2','5/10'],['Yoga','19-10-2026','19:00','Zaal 2','3/10'],['Boksfit','13-10-2026','18:30','Zaal 1','2/8']].map(l=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td><td>${l[2]}</td><td>${l[3]}</td><td>${l[4]}</td><td><span class="btn s o">Details</span> <span class="btn s">Deelnemers</span></td></tr>`).join('')}</table></div>
<div class="grid g2" style="margin-top:14px"><div class="card blue"><h3>Details – Yoga 12-10</h3>Zaal 2 · 60 min<br>Max. 10 deelnemers</div><div class="card blue"><h3>Deelnemers – Yoga 12-10</h3>1. Lid A<br>2. Lid B<br>3. Lid C</div></div></div></div>`),
'7 Beheer':()=>meta('Beheerder','Links het menu met alle beheertaken, rechts de werkruimte.')+fr('B','Dashboard',
`<div class="side"><div class="menu">${[['Ledenbeheer','Lid toevoegen','Lid wijzigen','Lid verwijderen'],['Trainerbeheer','Trainer toevoegen','Trainer wijzigen','Trainer verwijderen'],['Medewerkerbeheer','Medewerker toevoegen','Medewerker koppelen aan lessen'],['Lesbeheer','Les aanmaken','Les wijzigen','Les verwijderen']].map(g=>`<b>${g[0]}</b>${g.slice(1).map(x=>`<span>${x}</span>`).join('')}`).join('')}</div>
<div><h1>Lesbeheer</h1><span class="btn s">+ Les aanmaken</span><div class="tw" style="margin-top:10px"><table><tr><th>Les</th><th>Datum</th><th>Trainer</th><th>Inschr.</th><th>Acties</th></tr>${les.slice(0,3).map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[3]}</td><td>5/10</td><td><span class="btn s o">Wijzig</span> <span class="btn s r">Verwijder</span></td></tr>`).join('')}</table></div></div></div>`),
'Lessen aanmaken':()=>meta('Beheerder','Formulier om een nieuwe les toe te voegen. De les verschijnt daarna in het lesoverzicht van de leden.')+fr('B','Lessen',
`<div class="side"><div class="menu">${[['Ledenbeheer','Lid toevoegen','Lid wijzigen','Lid verwijderen'],['Trainerbeheer','Trainer toevoegen','Trainer wijzigen','Trainer verwijderen'],['Medewerkerbeheer','Medewerker toevoegen','Medewerker koppelen aan lessen'],['Lesbeheer','Les aanmaken','Les wijzigen','Les verwijderen']].map(g=>`<b>${g[0]}</b>${g.slice(1).map(x=>`<span>${x}</span>`).join('')}`).join('')}</div>
<div><h1>Lessen aanmaken</h1><div class="grid g2">${fv('Naam les','Pilates')}${fv('Trainer','Trainer B')}</div>${fv('Beschrijving','Rustige les met oefeningen voor kern, houding en lenigheid. Geschikt voor elk niveau.')}
<div class="grid g3">${fv('Datum','15-10-2026')}${fv('Starttijd','18:00')}${fv('Eindtijd','19:00')}</div>
<div class="grid g2">${fv('Locatie','Zaal 1')}${fv('Max. deelnemers','12')}</div>
<div class="okb">✔ Controle: Trainer B en Zaal 1 zijn op dit tijdstip vrij.</div>
<p><span class="btn">Les aanmaken</span> <span class="btn o">Annuleren</span></p></div></div>`),
'8 Profiel':()=>meta('Leden en trainers','Gegevens bekijken en wijzigen.')+fr('L','Mijn Profiel',
`<div class="narrow"><h1 style="text-align:center">Mijn profiel</h1>${fld('Naam','Naam (persoonlijke gegevens)')}${fld('Telefoon wijzigen')}${fld('Adres wijzigen')}${fld('Wachtwoord wijzigen','••••••••')}<span class="btn" style="width:100%">Opslaan</span></div>`),
'Menu per rol':()=>meta('Overzicht','Wat de blauwe balk toont per soort bezoeker.')+[['Bezoeker','V'],['Lid','L'],['Trainer','T'],['Beheerder','B']].map(x=>`<h3>${x[0]}</h3><div class="frame" style="margin-bottom:14px">${bar(x[1],'')}</div>`).join('')+`<p class="note">Footer op elke pagina: Contact, Privacybeleid, Algemene voorwaarden, e-mailadres, telefoonnummer, adres.</p>`
};
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
Object.keys(P).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{[...tabs.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');main.innerHTML=P[k]();scrollTo(0,0)};tabs.appendChild(b);if(!i)b.click()});
</script></body></html>
